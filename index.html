<!-- index.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CGPA 
 ক্যালকুলেটর</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
<div class="app">
<header class="header">
<h1>ডিপ্লোমা CGPA ক্যালকুলেটর</h1>
<p>2022 BTEB System</p>
<button class="toggle" onclick="toggleMode()">🌗 Dark / Light</button>
</header>


<div class="card" id="printArea">
<div class="row"><span>১ম পর্ব</span><input id="s1" type="number" step="0.01"><span>5%</span></div>
<div class="row"><span>২য় পর্ব</span><input id="s2" type="number" step="0.01"><span>5%</span></div>
<div class="row"><span>৩য় পর্ব</span><input id="s3" type="number" step="0.01"><span>10%</span></div>
<div class="row"><span>৪র্থ পর্ব</span><input id="s4" type="number" step="0.01"><span>10%</span></div>
<div class="row"><span>৫ম পর্ব</span><input id="s5" type="number" step="0.01"><span>20%</span></div>
<div class="row"><span>৬ষ্ঠ পর্ব</span><input id="s6" type="number" step="0.01"><span>20%</span></div>
<div class="row"><span>৭ম পর্ব</span><input id="s7" type="number" step="0.01"><span>20%</span></div>
<div class="row"><span>৮ম পর্ব</span><input id="s8" type="number" step="0.01"><span>10%</span></div>


<button onclick="calculate()">CGPA হিসাব করুন</button>
<div class="progress"><div id="bar"></div></div>
<div class="result" id="result"></div>


<div class="actions">
<button onclick="window.print()">🧾 Print / PDF</button>
<button onclick="clearData()">🗑️ Clear</button>
</div>
</div>


<footer class="footer">© Diploma Students Tool</footer>
</div>


<script src="script.js"></script>
</body>
</html>
